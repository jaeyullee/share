# =============================================================================
# Day 12 — GPU 자원 공유: Time-Slicing(소프트웨어) + MIG(하드웨어 격리)
# 전제: NVIDIA GPU Operator 설치됨. Time-Slicing은 대부분 GPU, MIG는 A100/H100만.
# 확인: oc get node <gpu-node> -o jsonpath='{.status.allocatable.nvidia\.com/gpu}{"\n"}'
# =============================================================================
---
# --- Time-Slicing: 물리 GPU 1개 → 논리 GPU 4~8개로 노출(소프트웨어 분할) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: nvidia-gpu-operator
data:
  any: |-
    version: v1
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 4
# 적용: ClusterPolicy.spec.devicePlugin.config 로 이 CM 참조 + 노드 라벨
#   oc label node <gpu-node> nvidia.com/device-plugin.config=time-slicing-config --overwrite
---
# --- MIG: 물리 GPU를 하드웨어 격리된 인스턴스로 분할(A100/H100) ---
# ClusterPolicy에서 mig.strategy 설정(single | mixed) 후 노드 라벨로 프로필 지정.
# (ClusterPolicy 전체는 GPU Operator가 관리 — 여기선 변경할 필드만 표기)
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata: {name: gpu-cluster-policy}
spec:
  mig:
    strategy: mixed          # single=동일프로필, mixed=프로필 혼합
  migManager:
    enabled: true
# 노드에 MIG 프로필 적용:
#   oc label node <a100-node> nvidia.com/mig.config=all-2g.10gb --overwrite
#   확인: nvidia-smi mig -lgi
---
# 멀티팀 격리 — MIG 슬라이스/공유 GPU에 ResourceQuota
apiVersion: v1
kind: ResourceQuota
metadata: {name: team-gpu-quota, namespace: ai-enablement}
spec:
  hard:
    requests.nvidia.com/gpu: "2"     # Time-Slicing이면 논리 GPU, MIG면 슬라이스 수
    limits.nvidia.com/gpu: "2"
---
# RHOAI HardwareProfile — 공유 GPU 프로필을 워크벤치/서빙에 노출
apiVersion: infrastructure.opendatahub.io/v1alpha1
kind: HardwareProfile
metadata:
  name: gpu-shared
  namespace: redhat-ods-applications
spec:
  displayName: "GPU Shared (time-slice/MIG)"
  enabled: true
  identifiers:
    - {displayName: "GPU", identifier: nvidia.com/gpu, minCount: 1, defaultCount: 1, resourceType: Accelerator}
    - {displayName: "CPU", identifier: cpu, minCount: "1", defaultCount: "2", resourceType: CPU}
    - {displayName: "Memory", identifier: memory, minCount: "2Gi", defaultCount: "4Gi", resourceType: Memory}
