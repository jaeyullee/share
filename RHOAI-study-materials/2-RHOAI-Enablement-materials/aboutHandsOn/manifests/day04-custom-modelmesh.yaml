# =============================================================================
# Day 4 — 커스텀 ServingRuntime + 멀티모델 서빙(ModelMesh)
# ★ ModelMesh = "1개 ServingRuntime에 여러 모델"(고밀도). v0.9/3.3에서 사용.
#   (RHOAI 3.4부터 ModelMesh는 deprecated → v1.0에선 제외했음. 환경 차이 주의)
# ModelMesh는 KServe Serverless/Raw와 별개 경로 — 네임스페이스에 modelmesh-enabled 라벨 필요.
# =============================================================================
---
# ModelMesh를 켤 네임스페이스 라벨 (별도 프로젝트 권장)
apiVersion: v1
kind: Namespace
metadata:
  name: ai-multimodel
  labels:
    opendatahub.io/dashboard: "true"
    modelmesh-enabled: "true"          # ★ ModelMesh 활성화 라벨
---
# 데이터커넥션(같은 형태) — day01 참고
apiVersion: v1
kind: Secret
metadata:
  name: aws-connection-models
  namespace: ai-multimodel
  labels: {opendatahub.io/dashboard: "true"}
  annotations: {opendatahub.io/connection-type: s3, serving.kserve.io/s3-endpoint: minio.ai-enablement.svc:9000, serving.kserve.io/s3-usehttps: "0"}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  AWS_S3_ENDPOINT: minio.ai-enablement.svc:9000
  AWS_S3_BUCKET: models
---
# ModelMesh ServingRuntime — multiModel: true (여러 모델을 이 런타임이 동적 적재)
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: modelmesh-ovms
  namespace: ai-multimodel
  labels: {opendatahub.io/dashboard: "true"}
  annotations: {openshift.io/display-name: "ModelMesh OVMS (multi-model)"}
spec:
  supportedModelFormats:
    - {name: onnx, version: "1", autoSelect: true}
    - {name: sklearn, version: "0", autoSelect: true}
  multiModel: true                     # ★ 멀티모델
  protocolVersions: [grpc-v2]
  grpcDataEndpoint: "port:8001"
  grpcEndpoint: "port:8085"
  containers:
    - name: ovms
      image: quay.io/modh/openvino_model_server:latest
      resources:
        requests: {cpu: "500m", memory: 1Gi}
        limits: {cpu: "2", memory: 4Gi}
  builtInAdapter:
    serverType: ovms
    runtimeManagementPort: 8888
    memBufferBytes: 134217728
    modelLoadingTimeoutMillis: 90000
---
# 모델 A (ModelMesh) — InferenceService deploymentMode: ModelMesh
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: model-a
  namespace: ai-multimodel
  annotations:
    serving.kserve.io/deploymentMode: ModelMesh
spec:
  predictor:
    model:
      modelFormat: {name: onnx}
      runtime: modelmesh-ovms
      storageUri: s3://models/jukebox      # 예시 모델 A
---
# 모델 B — 같은 런타임을 공유(멀티모델 격리/엔드포인트 확인 목적)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: model-b
  namespace: ai-multimodel
  annotations:
    serving.kserve.io/deploymentMode: ModelMesh
spec:
  predictor:
    model:
      modelFormat: {name: onnx}
      runtime: modelmesh-ovms
      storageUri: s3://models/mnist        # 예시 모델 B
---
# --- 커스텀 ServingRuntime 골격 (표준 런타임으로 안 되는 전처리/후처리 로직) ---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: custom-runtime-skeleton
  namespace: ai-enablement
  annotations: {openshift.io/display-name: "Custom Runtime (skeleton)"}
spec:
  supportedModelFormats:
    - {name: custom, version: "1", autoSelect: false}
  protocolVersions: [v2]
  multiModel: false
  containers:
    - name: kserve-container
      image: image-registry.openshift-image-registry.svc:5000/ai-enablement/my-custom-runtime:latest
      ports: [{containerPort: 8080}]
      env: [{name: MODEL_DIR, value: /mnt/models}]
      resources:
        requests: {cpu: "500m", memory: 1Gi}
        limits: {cpu: "2", memory: 2Gi}
