# =============================================================================
# Day 3 — 무중단 배포: 카나리(canaryTrafficPercent) + Blue-Green
# ★ canaryTrafficPercent는 **Serverless(Knative) 모드 전용** 기능 — v0.9/3.3 환경의 핵심.
#   (RawDeployment에는 없어서 v1.0에선 Gateway API로 대체했음 — 환경 차이 주의)
# 시나리오: 사기탐지 모델 v1 → 더 정확한 v2로 무중단 교체.
# =============================================================================
---
# 카나리: 하나의 InferenceService를 업데이트하면서 새 리비전에 X%만 흘린다.
# 절차:
#   1) 아래를 v1 storageUri로 먼저 적용 → Ready 확인(이때 100% v1)
#   2) storageUri를 v2로 바꾸고 canaryTrafficPercent: 10 으로 재적용
#      → KServe가 새 리비전 생성, 신규 10% / 기존(LatestReadyRevision) 90%
#   3) 100회 호출로 비율 확인 → canaryTrafficPercent: 50 → 100(또는 필드 제거=전량 전환)
#   4) 문제 시 canaryTrafficPercent: 0 또는 직전 storageUri로 롤백
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-canary
  namespace: ai-enablement
  annotations:
    serving.kserve.io/deploymentMode: Serverless
spec:
  predictor:
    serviceAccountName: kserve-sa
    minReplicas: 1
    canaryTrafficPercent: 10        # ★ 새 리비전에 흘릴 비율(0~100). Serverless 전용.
    model:
      modelFormat: {name: sklearn}
      runtime: mlserver-sklearn
      storageUri: s3://models/fraud-v2    # 1단계엔 s3://models/fraud, 2단계에 v2로 변경
# 트래픽 확인:
#   URL=$(oc get isvc fraud-canary -n ai-enablement -o jsonpath='{.status.url}')
#   for i in $(seq 100); do curl -sk $URL/v2/models/fraud-canary/infer -d @../models/fraud/sample_request.json; done
#   oc get isvc fraud-canary -n ai-enablement -o jsonpath='{.status.components.predictor.traffic}{"\n"}'
---
# --- Blue-Green (대안 전략): 리비전 분할 대신 ISVC 2개 + 안정 Service selector 전환 ---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-blue
  namespace: ai-enablement
  labels: {app: fraud, slot: blue}
  annotations: {serving.kserve.io/deploymentMode: Serverless}
spec:
  predictor:
    serviceAccountName: kserve-sa
    model: {modelFormat: {name: sklearn}, runtime: mlserver-sklearn, storageUri: "s3://models/fraud"}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-green
  namespace: ai-enablement
  labels: {app: fraud, slot: green}
  annotations: {serving.kserve.io/deploymentMode: Serverless}
spec:
  predictor:
    serviceAccountName: kserve-sa
    model: {modelFormat: {name: sklearn}, runtime: mlserver-sklearn, storageUri: "s3://models/fraud-v2"}
---
# 안정 엔드포인트 — selector를 blue↔green으로 patch해 무중단 전환/롤백.
# 전환: oc patch svc fraud-stable -n ai-enablement -p '{"spec":{"selector":{"slot":"green"}}}'
apiVersion: v1
kind: Service
metadata:
  name: fraud-stable
  namespace: ai-enablement
spec:
  selector: {app: fraud, slot: blue}
  ports:
    - {name: http, port: 80, targetPort: 8080}
