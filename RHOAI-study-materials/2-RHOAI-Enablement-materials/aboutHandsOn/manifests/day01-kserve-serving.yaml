# =============================================================================
# Day 1 — KServe 기본 모델 배포 (sklearn) + 트러블슈팅
# 기준: OCP 4.21 / RHOAI 3.3 / KServe **Serverless(Knative)** 모드 (AI500 환경)
# 전제: 클러스터·RHOAI는 이미 설치됨(AI500/Red Hat Demo). Serverless+ServiceMesh 활성.
#       모델 산출물 = models/train_iris_sklearn.py → iris/model.joblib, S3(MinIO) 업로드.
# 적용: oc apply -n ai-enablement -f day01-kserve-serving.yaml
# 확인: oc get isvc -n ai-enablement
#   oc wait --for=condition=Ready isvc/iris-sklearn -n ai-enablement --timeout=300s
# 추론(Serverless는 Knative Route로 노출):
#   URL=$(oc get isvc iris-sklearn -n ai-enablement -o jsonpath='{.status.url}')
#   curl -k $URL/v2/models/iris-sklearn/infer -d @../models/iris/sample_request.json
# 트러블슈팅(Day1 후반 세션):
#   oc describe isvc/iris-sklearn -n ai-enablement
#   oc logs -l serving.kserve.io/inferenceservice=iris-sklearn -n ai-enablement
#   oc get events -n ai-enablement --sort-by=.lastTimestamp | tail
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-enablement
  labels:
    opendatahub.io/dashboard: "true"
---
# S3/MinIO 데이터 커넥션 (AI500 환경은 보통 자동 생성됨 — 직접 만들 때의 형태)
apiVersion: v1
kind: Secret
metadata:
  name: aws-connection-models
  namespace: ai-enablement
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type: s3
    openshift.io/display-name: models-s3
    serving.kserve.io/s3-endpoint: minio.ai-enablement.svc:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
    serving.kserve.io/s3-verifyssl: "0"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  AWS_S3_ENDPOINT: minio.ai-enablement.svc:9000
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_BUCKET: models
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-sa
  namespace: ai-enablement
secrets:
  - name: aws-connection-models
---
# sklearn ServingRuntime (MLServer, v2 프로토콜)
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: mlserver-sklearn
  namespace: ai-enablement
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "MLServer sklearn"
spec:
  supportedModelFormats:
    - name: sklearn
      version: "1"
      autoSelect: true
  protocolVersions: [v2]
  multiModel: false
  containers:
    - name: kserve-container
      image: quay.io/aipipeline/mlserver:1.6.1     # 클러스터 OOTB 템플릿 우선 사용 권장
      env:
        - name: MLSERVER_MODEL_IMPLEMENTATION
          value: mlserver_sklearn.SKLearnModel
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests: {cpu: "500m", memory: 1Gi}
        limits: {cpu: "2", memory: 2Gi}
---
# InferenceService — Serverless 모드(기본). 명시하려면 deploymentMode 어노테이션.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: iris-sklearn
  namespace: ai-enablement
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    serving.kserve.io/deploymentMode: Serverless   # ★ v0.9/3.3 = Serverless(Knative)
spec:
  predictor:
    serviceAccountName: kserve-sa
    minReplicas: 1
    model:
      modelFormat: {name: sklearn}
      runtime: mlserver-sklearn
      storageUri: s3://models/iris
      resources:
        requests: {cpu: "500m", memory: 1Gi}
        limits: {cpu: "2", memory: 2Gi}
