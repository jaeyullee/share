# =============================================================================
# Day 6 — Jupyter Workbench 모델 훈련 + Git 연동 + 라이브러리
# 기준: RHOAI 3.3. 워크벤치에서 iris RandomForest 훈련(models/train_iris_sklearn.py).
# 확인: oc get notebook -n ai-enablement ; 대시보드 → Workbench 'Running'
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbench-pvc
  namespace: ai-enablement
  labels: {opendatahub.io/dashboard: "true"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
# Git 연동 Secret (HTTPS PAT). SSH면 ssh-privatekey 키로.
apiVersion: v1
kind: Secret
metadata:
  name: git-creds
  namespace: ai-enablement
type: Opaque
stringData:
  username: git-user
  password: REPLACE_WITH_PAT
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: ds-workbench
  namespace: ai-enablement
  labels:
    app: ds-workbench
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "Data Science Workbench"
    notebooks.opendatahub.io/inject-oauth: "true"
spec:
  template:
    spec:
      serviceAccountName: ds-workbench
      containers:
        - name: ds-workbench
          # 대시보드의 노트북 이미지스트림 태그로 교체:
          # oc get imagestream -n redhat-ods-applications | grep -i datascience
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2024.1
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: workbench-pvc, mountPath: /opt/app-root/src}
          ports:
            - {containerPort: 8888, name: notebook-port, protocol: TCP}
      volumes:
        - name: workbench-pvc
          persistentVolumeClaim: {claimName: workbench-pvc}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ds-workbench
  namespace: ai-enablement
