# =============================================================================
# Day 8 — Model Registry 등록 + 버전관리/승격 + Registry→KServe 연동
# 전제: RHOAI 3.3 Model Registry 활성(AI500 환경엔 보통 구성됨).
# 등록은 REST/Python(아래 주석), 서빙은 ISVC storageUri로 연결.
# =============================================================================
---
# Registry에 등록된 모델을 KServe(Serverless)로 서빙
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: model-from-registry
  namespace: ai-enablement
  labels:
    opendatahub.io/dashboard: "true"
    modelregistry.opendatahub.io/registered-model-id: "1"
    modelregistry.opendatahub.io/model-version-id: "2"
  annotations:
    serving.kserve.io/deploymentMode: Serverless
spec:
  predictor:
    serviceAccountName: kserve-sa
    model:
      modelFormat: {name: onnx}
      runtime: ovms-onnx
      storageUri: s3://models/jukebox
# -----------------------------------------------------------------------------
# 등록/승격 (워크벤치에서 Python — model-registry SDK):
#   pip install model-registry
#   from model_registry import ModelRegistry
#   reg = ModelRegistry("https://<registry-rest-route>", author="consultant")
#   rm = reg.register_model(name="fraud-model", uri="s3://models/fraud",
#         version="1", model_format_name="sklearn", model_format_version="1")
#   # 상태 승격: development -> staging -> production
# REST 조회:
#   curl -H "Authorization: Bearer $TOKEN" \
#     https://<registry-rest-route>/api/model_registry/v1alpha3/registered_models
# =============================================================================
