# =============================================================================
# Day 7 — Data Science Pipeline (KFP v2) 백엔드 + 템플릿/재사용
# 적용: oc apply -n ai-enablement -f day07-dspa.yaml
# 확인: oc get dspa -n ai-enablement ; 대시보드 → Pipelines 서버 'Running'
# 파이프라인 코드: day07-pipeline.py (compile → 업로드 → Run → 파라미터 변경 재실행)
# =============================================================================
---
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: dspa
  namespace: ai-enablement
spec:
  dspVersion: v2
  objectStorage:
    externalStorage:
      bucket: pipelines
      host: minio.ai-enablement.svc:9000
      scheme: http
      s3CredentialsSecret:
        secretName: aws-connection-models
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY
  # 메타데이터 DB는 기본 클러스터 내 MariaDB 자동배포.
