# =============================================================================
# Day 9 — AI 워크로드 RBAC + 데이터 연결 보안(Secret) + PVC
# 검증: oc auth can-i create notebooks --as=ds-user -n ai-enablement      # yes
#       oc auth can-i delete inferenceservices --as=ds-user -n ai-enablement  # no
# =============================================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-scientist
  namespace: ai-enablement
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["notebooks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["datasciencepipelinesapplications.opendatahub.io"]
    resources: ["datasciencepipelinesapplications"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "servingruntimes"]
    verbs: ["get", "list", "watch"]          # 서빙은 읽기만(배포는 admin)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-scientist-binding
  namespace: ai-enablement
subjects:
  - kind: User
    name: ds-user
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: data-scientist
  apiGroup: rbac.authorization.k8s.io
---
# S3 자격증명을 코드 밖 Secret으로(코드에 credential 제거)
apiVersion: v1
kind: Secret
metadata:
  name: s3-data-creds
  namespace: ai-enablement
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  AWS_S3_ENDPOINT: minio.ai-enablement.svc:9000
---
# 학습 데이터용 PVC (워크벤치 마운트)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data-pvc
  namespace: ai-enablement
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
