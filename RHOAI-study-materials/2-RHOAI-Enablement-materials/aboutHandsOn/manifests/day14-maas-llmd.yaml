# =============================================================================
# Day 14 — LLM 서빙(MaaS) + llm-d 성능 비교 (Environment B - GPU)
# 모델: models/llm-serving-models.md 의 HF 모델(예: Llama 3.1 8B, Granite).
# 확인:
#   URL=$(oc get isvc llm-vllm -n ai-enablement -o jsonpath='{.status.url}')
#   curl $URL/v1/chat/completions -H 'Content-Type: application/json' \
#     -d '{"model":"llm","messages":[{"role":"user","content":"안녕"}]}'
# =============================================================================
---
# vLLM ServingRuntime (OpenAI 호환 API, Serverless)
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  namespace: ai-enablement
  labels: {opendatahub.io/dashboard: "true"}
  annotations: {openshift.io/display-name: "vLLM (GPU, OpenAI API)"}
spec:
  supportedModelFormats:
    - {name: vLLM, autoSelect: true}
  multiModel: false
  containers:
    - name: kserve-container
      image: quay.io/modh/vllm:latest
      args:
        - --model=/mnt/models
        - --port=8080
        - --served-model-name=llm
        - --max-model-len=4096
        - --gpu-memory-utilization=0.9
      ports: [{containerPort: 8080, protocol: TCP}]
      resources:
        requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: "1"}
        limits: {cpu: "8", memory: 24Gi, nvidia.com/gpu: "1"}
---
# 단일 GPU 베이스라인 (Day14 전반: Prefill/Decode·KV캐시 이해, GuideLLM 30초 벤치)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llm-vllm
  namespace: ai-enablement
  annotations: {serving.kserve.io/deploymentMode: Serverless}
spec:
  predictor:
    serviceAccountName: kserve-sa
    minReplicas: 1
    model:
      modelFormat: {name: vLLM}
      runtime: vllm-runtime
      storageUri: s3://models/llama-3.1-8b-instruct
---
# --- llm-d: Prefix Cache Aware Routing (Day14 후반: P95/P99 개선 입증) ---
# "GPU 증설 != P95 개선"을 보이는 핵심. LLMInferenceService로 여러 vLLM 백엔드를
# 캐시 인식 라우팅으로 묶는다. (API group은 설치된 llm-d 버전에 맞게 확인)
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: llm-d-router
  namespace: ai-enablement
spec:
  model:
    uri: s3://models/llama-3.1-8b-instruct
    name: llm
  replicas: 4
  router:
    scheduling:
      # 프리픽스 캐시 인식 라우팅: 같은 프리픽스 요청을 같은 백엔드로 → KV캐시 히트율↑
      prefixCacheAware: true
  template:
    containers:
      - name: vllm
        image: quay.io/modh/vllm:latest
        resources:
          limits: {nvidia.com/gpu: "1"}
# 벤치마크(GuideLLM):
#   1) vLLM 4 replica(라운드로빈) 300초 → P95 TTFT 기록
#   2) llm-d(위) 동일 벤치 → P95/P99 개선 측정
#   3) Grafana에서 캐시 히트율·라우팅 결정 관찰
