# =============================================================================
# Day 2 — TensorFlow / PyTorch 모델 배포 (멀티프레임워크, Serverless)
# 산출물: models/train_tf_savedmodel.py → tf-fraud/1/saved_model.pb
#         models/train_mnist_pytorch.py → mnist/1/model.onnx (또는 .pt/.mar)
#         S3(MinIO) 업로드 후 storageUri로 참조.
# 전제: day01의 Namespace(ai-enablement)/데이터커넥션/SA 재사용.
# =============================================================================
---
# TensorFlow SavedModel — KServe 내장 tensorflow 런타임
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: tf-fraud
  namespace: ai-enablement
  annotations:
    serving.kserve.io/deploymentMode: Serverless
spec:
  predictor:
    serviceAccountName: kserve-sa
    minReplicas: 1
    model:
      modelFormat: {name: tensorflow}
      storageUri: s3://models/tf-fraud      # tf-fraud/1/saved_model.pb
      resources:
        requests: {cpu: "500m", memory: 1Gi}
        limits: {cpu: "2", memory: 2Gi}
---
# PyTorch — ONNX로 변환해 OpenVINO(OVMS)로 서빙(CPU 친화). TorchServe(.mar)도 가능.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: ovms-onnx
  namespace: ai-enablement
  labels: {opendatahub.io/dashboard: "true"}
  annotations: {openshift.io/display-name: "OpenVINO Model Server (ONNX)"}
spec:
  supportedModelFormats:
    - {name: onnx, version: "1", autoSelect: true}
  protocolVersions: [v2, grpc-v2]
  multiModel: false
  containers:
    - name: kserve-container
      image: quay.io/modh/openvino_model_server:latest   # OOTB 템플릿 우선
      args:
        - --model_name={{.Name}}
        - --port=8001
        - --rest_port=8080
        - --model_path=/mnt/models
        - --target_device=CPU
      ports: [{containerPort: 8080, protocol: TCP}]
      resources:
        requests: {cpu: "500m", memory: 1Gi}
        limits: {cpu: "2", memory: 2Gi}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: mnist-pytorch
  namespace: ai-enablement
  annotations:
    serving.kserve.io/deploymentMode: Serverless
spec:
  predictor:
    serviceAccountName: kserve-sa
    minReplicas: 1
    model:
      modelFormat: {name: onnx}
      runtime: ovms-onnx
      storageUri: s3://models/mnist          # mnist/1/model.onnx
      resources:
        requests: {cpu: "500m", memory: 1Gi}
        limits: {cpu: "2", memory: 2Gi}
